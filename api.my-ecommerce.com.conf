# /etc/nginx/sites-available/api.my-ecommerce.com.conf
# 1. Tự động chuyển hướng toàn bộ HTTP (80) sang HTTPS (443)
server {
    listen 80;
    listen [::]:80;
    server_name api.my-ecommerce.com;
    return 301 https://$host$request_uri;
}

# 2. Cấu hình HTTPS (Port 443) sử dụng chứng chỉ Let's Encrypt
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.my-ecommerce.com;

    ssl_certificate /etc/letsencrypt/live/api.my-ecommerce.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.my-ecommerce.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
